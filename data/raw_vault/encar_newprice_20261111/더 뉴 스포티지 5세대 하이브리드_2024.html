<script language="javascript">


    var strCompanyUrl = "/common/combo/cardbcompany.json?method=carList";
    var strModelGroupUrl = "/common/combo/modelgroupfordb.json?method=carList";
    var strModelUrl = "/common/combo/cardbmodel.json?method=carList";
    var strYrJatoUrl = "/common/combo/jatoYr.json?method=carList";

    var companyid = "mnfccd";
    var modelgroupid = "mdlgroupcd";
    var modelid = "mdlcd";
    var yearid = "caryear";

    function initGnb() {
        var paramCompany = $("paramMnfccd").value;
        var paramModelGroup = $("paramMdlgroupcd").value;
        var paramModel = $("paramMdlcd").value;
        var paramYr = $("paramYear").value;

        // 제조사
        if (paramModel != "") {
            $("mdlcd").show();
        }

        //console.log("companyid :: " + companyid)
        //console.log("paramCompany :: " + paramCompany)
		if($('foldYn').value != 0){
            foldingYN('f_fold');
		}

        setCompany(strCompanyUrl, companyid, "제조사", paramCompany);

        // 제조사 값이 있으면 모델 검색
        if (paramCompany >= '010') {
            if (paramCompany != "") {
                if (paramModel == "") {
                    paramModel = paramModelGroup;
                }
                setModel(strModelUrl, modelid, paramCompany, "모델", paramModel)
                $("mdlgroupcd").hide();

            }
        } else {
            $("mdlgroupcd").show();
            if (paramCompany != "") {
                setModelGroup(strModelGroupUrl, modelgroupid, paramCompany, "모델", paramModelGroup);
                if (paramModelGroup != "") {
                    setModel_New(strModelUrl, modelid, paramCompany, paramModelGroup, "세부모델", paramModel);
                }
            }

        }
        if (paramCompany != "" && paramModel != "") {
            setCarYear(strYrJatoUrl, yearid, paramCompany, paramModel, "형식연도", paramYr);
        }

        waitTime = 1;
    }

    function changeModel_jato(mnfccd, mdlgroupcd) {
        setModel_New(strModelUrl, modelid, mnfccd, mdlgroupcd, "세부모델", "");
        //모델그룹선택시 기본 세부모델선택
        if ($("mdlcd") != null) {
            $("mdlcd").selectedIndex = 1;
            var mdlcd = $("mdlcd").options[$("mdlcd").selectedIndex].value;
            changeYearJato(mnfccd, mdlcd);
        }
    }

    function changeYearJato(mnfccd,mdlcd) {
        setCarYear(strYrJatoUrl, yearid, mnfccd, mdlcd, "형식연도", "");
        $(yearid).options[1].selected = true;
    }



    //덧글 리스트
    function viewForm(index) {

        var object = $("default" + index);
        var objectSum = $("defaultSum" + index);
        var selectSum = $("choiceSum" + index);
        var object1 = $("choice" + index);
        if (object != null) {
            if (object.style.display == 'none') {
                objectSum.hide();
                selectSum.hide();
                object.style.display = "block";
                object1.style.display = "block";

            } else {
                object.hide();
                object1.hide();
                objectSum.style.display = "block";
                selectSum.style.display = "block";
            }
        }
    }

    function viewAll() {
        for (var i = 1; i <=0; i++) {
            $("default" + i).style.display = "block";
            $("defaultSum" + i).style.display = "none";
            $("choice" + i).style.display = "block";
            $("choiceSum" + i).style.display = "none";
        }
    }

    function closeAll() {
        for (var i = 1; i <=0; i++) {
            $("default" + i).style.display = "none";
            $("defaultSum" + i).style.display = "block";
            $("choice" + i).style.display = "none";
            $("choiceSum" + i).style.display = "block";
        }
    }

    function firstLayerOpen() {
        //viewForm(1);
    }

    function foldingYN(param) {
        if (param == "f_fold") {
            document.getElementById("folding").innerHTML ="<a href=\"javascript:foldingYN('f_unfold')\" class='folding f_unfold'>전체등급 펼쳐보기<em class='db_ir'></em></a>";
            document.getElementById("f_unfold").style.display = "none";
            document.getElementById("f_fold").style.display = "";
        } else {
            document.getElementById("folding").innerHTML = "<a href=\"javascript:foldingYN('f_fold')\" class='folding f_fold'>접기<em class='db_ir'></em></a>";
            document.getElementById("f_unfold").style.display = "";
            document.getElementById("f_fold").style.display = "none";
        }
    }

    function onSubmit() {
        jQuery("#searchForm").submit();

    }
    window.onload = initGnb;

</script>
