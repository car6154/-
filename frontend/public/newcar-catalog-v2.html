<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신차 공식 카탈로그 V2 (등급별 차등 가격) | J-PRO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0c10;
      color: #e4e4e7;
      line-height: 1.5;
      font-size: 13px;
    }
    header {
      background-color: #14151b;
      border-bottom: 1px solid #262833;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: #10b981;
      letter-spacing: -0.02em;
    }
    .header-badge {
      font-size: 11px;
      background-color: #064e3b;
      color: #6ee7b7;
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid #047857;
      font-weight: 600;
    }
    .search-bar-container {
      background-color: #121319;
      border-bottom: 1px solid #20222b;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-label {
      font-size: 11px;
      color: #71717a;
      font-weight: 600;
    }
    .select-input {
      background-color: #0b0c10;
      border: 1px solid #2a2d3d;
      color: #f4f4f5;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .select-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }
    .select-input option {
      background-color: #14151b;
      color: #f4f4f5;
    }
    .btn-search {
      background-color: #10b981;
      color: #042f2e;
      font-weight: 700;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background-color 0.15s;
    }
    .btn-search:hover {
      background-color: #34d399;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .card {
      background-color: #14151b;
      border: 1px solid #262833;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .info-item {
      background-color: #0b0c10;
      border: 1px solid #1e2029;
      padding: 12px 14px;
      border-radius: 8px;
    }
    .info-item-label {
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    .info-item-val {
      font-size: 15px;
      font-weight: 700;
      color: #fafafa;
    }
    .price-highlight {
      color: #10b981;
      font-size: 18px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #f4f4f5;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .options-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .options-table th {
      background-color: #181a24;
      color: #a1a1aa;
      font-size: 11px;
      font-weight: 600;
      padding: 10px 14px;
      border-bottom: 1px solid #262833;
    }
    .options-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #1e2029;
      vertical-align: top;
    }
    .options-table tr:hover {
      background-color: #181922;
    }
    .opt-name {
      font-weight: 700;
      color: #fafafa;
      font-size: 13px;
    }
    .opt-price {
      font-weight: 700;
      color: #38bdf8;
      font-size: 14px;
      white-space: nowrap;
    }
    .opt-desc {
      color: #a1a1aa;
      font-size: 12px;
      line-height: 1.4;
    }
    .alert-box {
      background-color: #1e1b18;
      border: 1px solid #451a03;
      border-radius: 8px;
      padding: 16px;
      color: #fdba74;
      margin-bottom: 16px;
    }
    .alert-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
      color: #f97316;
    }
    .fallback-link {
      display: inline-block;
      margin-top: 10px;
      color: #38bdf8;
      text-decoration: underline;
      font-weight: 600;
      font-size: 12px;
    }
    .empty-badge {
      display: inline-block;
      background-color: #1f2937;
      color: #9ca3af;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title-box">
      <span class="header-title">신차가격표 V2</span>
      <span class="header-badge">등급별 차등 가격</span>
    </div>
    <div style="font-size: 11px; color: #71717a;">
      신차가격표 기준 (309개 국산 전 차종 수록)
    </div>
  </header>

  <div class="search-bar-container">
    <div class="input-group">
      <span class="input-label">브랜드:</span>
      <select id="selectBrand" class="select-input" style="min-width: 100px;">
        <option value="">브랜드 선택</option>
      </select>
    </div>
    <div class="input-group">
      <span class="input-label">차종:</span>
      <select id="selectModel" class="select-input" style="min-width: 160px; max-width: 240px;">
        <option value="">차종 선택</option>
      </select>
    </div>
    <div class="input-group">
      <span class="input-label">연식:</span>
      <select id="selectYear" class="select-input" style="min-width: 90px;">
        <option value="">연식 선택</option>
      </select>
    </div>
    <div class="input-group">
      <span class="input-label">등급:</span>
      <select id="selectGrade" class="select-input" style="min-width: 220px; max-width: 340px;">
        <option value="">등급 선택</option>
      </select>
    </div>
    <button type="button" id="btnSearch" class="btn-search">조회</button>
  </div>

  <main id="mainContainer">
    <div id="loadingView" class="loading-spinner">
      데이터를 불러오는 중입니다...
    </div>
    <div id="contentView" style="display: none;"></div>
  </main>

  <script>
    let catalogTree = null;
    let catalogBrands = [];

    // URL 해시 및 쿼리 파라미터 파싱
    function parseParams() {
      const hash = window.location.hash.replace(/^#/, '');
      const hashParams = new URLSearchParams(hash);
      const searchParams = new URLSearchParams(window.location.search);

      return {
        source: hashParams.get('source') || searchParams.get('source') || 'danawa',
        brand: hashParams.get('brand') || searchParams.get('brand') || '',
        model: hashParams.get('model') || searchParams.get('model') || '',
        year: hashParams.get('year') || searchParams.get('year') || '',
        grade: hashParams.get('grade') || searchParams.get('grade') || ''
      };
    }

    // 차종명으로 브랜드 역추적
    function findBrandForModel(modelName) {
      if (!catalogTree || !modelName) return '';
      // 1. 트리에서 직접 검색 (완전 일치)
      for (const brand of catalogBrands) {
        if (catalogTree[brand] && catalogTree[brand][modelName]) {
          return brand;
        }
      }
      // 2. [11-06-68] 공백 및 대소문자 무시 일치 검색 (FL 별칭 등 포함)
      const cleanInput = modelName.replace(/\s+/g, '').toLowerCase().replace(/fl$/, '');
      for (const brand of catalogBrands) {
        if (!catalogTree[brand]) continue;
        for (const m of Object.keys(catalogTree[brand])) {
          const cleanM = m.replace(/\s+/g, '').toLowerCase();
          if (cleanM === cleanInput || cleanM.includes(cleanInput) || cleanInput.includes(cleanM)) {
            return brand;
          }
        }
      }
      // 3. [11-06-68] 차종명 키워드 기반 브랜드 Fallback
      if (/(?:g70|g80|g90|gv60|gv70|gv80|eq900)/i.test(modelName)) return '제네시스';
      if (/(?:k3|k5|k7|k8|k9|모닝|레이|쏘렌토|카니발|스포티지|셀토스|니로|ev3|ev6|ev9|모하비|스팅어|스토닉|쏘울|봉고)/i.test(modelName)) return '기아';
      if (/(?:트레일블레이저|트랙스|말리부|스파크|콜로라도|타호|트래버스|이쿼녹스|볼트|올란도|크루즈|카마로)/i.test(modelName)) return '쉐보레';
      if (/(?:토레스|티볼리|코란도|렉스턴|액티언|무쏘)/i.test(modelName)) return 'KGM';
      if (/(?:xm3|qm6|sm6|아르카나|콜레오스|sm3|sm5|sm7|클리오|캡처|트위지|마스터)/i.test(modelName)) return '르노코리아';
      if (/(?:아반떼|쏘나타|그랜저|투싼|싼타페|팰리세이드|코나|베뉴|캐스퍼|아이오닉|스타리아|포터)/i.test(modelName)) return '현대';

      return '';
    }

    // [11-06-68] API 응답 스펙을 기반으로 상단 드롭다운 자동 동기화
    function syncDropdownsWithSpec(data) {
      if (!data || !catalogTree) return;
      const canonicalCar = data.car_name;
      const canonicalYear = data.year;
      const canonicalGrade = data.grade;

      let brand = findBrandForModel(canonicalCar);
      if (!brand && catalogBrands.length > 0) brand = catalogBrands[0];

      populateBrands(brand);
      populateModels(brand, canonicalCar);
      populateYears(brand, canonicalCar, canonicalYear);
      populateGrades(brand, canonicalCar, canonicalYear, canonicalGrade);
    }

    // 브랜드 드롭다운 채우기
    function populateBrands(selectedBrand) {
      const el = document.getElementById('selectBrand');
      el.innerHTML = '<option value="">브랜드 선택</option>';
      catalogBrands.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        if (b === selectedBrand) opt.selected = true;
        el.appendChild(opt);
      });
    }

    // 차종 드롭다운 채우기
    function populateModels(brand, selectedModel) {
      const el = document.getElementById('selectModel');
      el.innerHTML = '<option value="">차종 선택</option>';
      if (!brand || !catalogTree[brand]) return;

      const models = Object.keys(catalogTree[brand]).sort((a, b) => a.localeCompare(b, 'ko'));
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        if (m === selectedModel) opt.selected = true;
        el.appendChild(opt);
      });
    }

    // 연식 드롭다운 채우기 (최신순)
    function populateYears(brand, model, selectedYear) {
      const el = document.getElementById('selectYear');
      el.innerHTML = '<option value="">연식 선택</option>';
      if (!brand || !model || !catalogTree[brand] || !catalogTree[brand][model]) return;

      const years = Object.keys(catalogTree[brand][model]).sort((a, b) => {
        const na = parseInt(a, 10) || 0;
        const nb = parseInt(b, 10) || 0;
        return nb - na;
      });
      years.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = `${y}년형`;
        if (String(y) === String(selectedYear)) opt.selected = true;
        el.appendChild(opt);
      });
    }

    // 등급 드롭다운 채우기
    function populateGrades(brand, model, year, selectedGrade) {
      const el = document.getElementById('selectGrade');
      el.innerHTML = '<option value="">등급 선택</option>';
      if (!brand || !model || !year || !catalogTree[brand] || !catalogTree[brand][model] || !catalogTree[brand][model][year]) return;

      const grades = catalogTree[brand][model][year];
      grades.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        if (g === selectedGrade || (selectedGrade && g.includes(selectedGrade))) opt.selected = true;
        el.appendChild(opt);
      });
    }

    async function fetchCatalogSpec(source, model, year, grade) {
      const loading = document.getElementById('loadingView');
      const content = document.getElementById('contentView');
      loading.style.display = 'block';
      content.style.display = 'none';

      // 상대 경로 호출 (절대 URL 및 8000 직결 금지)
      const url = `/api/catalog-v2/spec?source=${encodeURIComponent(source || 'danawa')}&car_name=${encodeURIComponent(model)}&year=${encodeURIComponent(year)}&grade=${encodeURIComponent(grade || '')}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        // [11-06-68] API 스펙 매칭 성공 시 정규화된 차종명/연식/등급으로 상단 드롭다운 동기화
        if (data && data.found) {
          syncDropdownsWithSpec(data);
        }
        renderResult(data, { source: source || 'danawa', model, year, grade });
      } catch (err) {
        renderError(`네트워크 요청 중 오류가 발생했습니다: ${err.message}`, { source: source || 'danawa', model, year, grade });
      } finally {
        loading.style.display = 'none';
        content.style.display = 'block';
      }
    }

    function renderResult(data, query) {
      const content = document.getElementById('contentView');
      
      if (!data || !data.found) {
        const reason = data ? (data.reason || '가격 미확인') : '응답 데이터 없음';
        const fallbackUrl = `/newcar-catalog.html#model=${encodeURIComponent(query.model)}&year=${encodeURIComponent(query.year)}`;
        content.innerHTML = `
          <div class="alert-box">
            <div class="alert-title">⚠️ 카탈로그 V2 가격 미확인</div>
            <div>${escapeHtml(reason)}</div>
            <div style="margin-top: 6px; font-size: 12px; color: #a1a1aa;">
              조회 조건: 차종=${escapeHtml(query.model || '-')}, 연식=${escapeHtml(query.year || '-')}, 등급=${escapeHtml(query.grade || '-')}
            </div>
            ${query.model ? `<a href="${fallbackUrl}" class="fallback-link" target="_blank">구 카탈로그(V1) 뷰어로 보기 &rarr;</a>` : ''}
          </div>
        `;
        return;
      }

      const options = data.options || {};
      const optKeys = Object.keys(options);
      const baseMan = data.base_price_man ? Number(data.base_price_man).toLocaleString() : (data.base_price ? (Math.round(data.base_price / 10000)).toLocaleString() : '-');
      const baseWon = data.base_price ? Number(data.base_price).toLocaleString() : '-';

      let optionsHtml = '';
      if (optKeys.length === 0) {
        optionsHtml = `<tr><td colspan="3" style="text-align: center; color: #71717a; padding: 20px;">등록된 선택 옵션이 없습니다.</td></tr>`;
      } else {
        optionsHtml = optKeys.map(k => {
          const item = options[k];
          const pMan = item.price_man != null ? Number(item.price_man).toLocaleString() : (item.price != null ? Math.round(item.price / 10000).toLocaleString() : '-');
          const pWon = item.price != null ? Number(item.price).toLocaleString() : '-';
          return `
            <tr>
              <td class="opt-name">${escapeHtml(k)}</td>
              <td class="opt-price">${pMan}만원 <span style="font-size: 11px; color: #71717a; font-weight: normal;">(${pWon}원)</span></td>
              <td class="opt-desc">${escapeHtml(item.desc || '-')}</td>
            </tr>
          `;
        }).join('');
      }

      const standardFeatures = data.standard_features || [];
      let standardHtml = '';
      if (!standardFeatures || standardFeatures.length === 0) {
        standardHtml = `<span class="empty-badge">기본사양 미수집</span>`;
      } else {
        standardHtml = standardFeatures.map(f => `<span class="empty-badge" style="margin-right: 6px; margin-bottom: 6px;">${escapeHtml(f)}</span>`).join('');
      }

      content.innerHTML = `
        <div class="card">
          <div class="info-grid">
            <div class="info-item">
              <div class="info-item-label">기준</div>
              <div class="info-item-val" style="color: #6ee7b7;">신차가격표 (공식)</div>
            </div>
            <div class="info-item">
              <div class="info-item-label">차종 / 연식</div>
              <div class="info-item-val">${escapeHtml(data.car_name || '-')} (${escapeHtml(data.year || '-')})</div>
            </div>
            <div class="info-item">
              <div class="info-item-label">선택 등급</div>
              <div class="info-item-val" style="color: #38bdf8;">${escapeHtml(data.grade || '-')}</div>
            </div>
            <div class="info-item">
              <div class="info-item-label">기본 출고가</div>
              <div class="info-item-val price-highlight">${baseMan}만원 <span style="font-size: 12px; color: #71717a; font-weight: normal;">(${baseWon}원)</span></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">
            <span>📦 선택 가능 옵션 목록</span>
            <span style="font-size: 11px; color: #71717a; font-weight: normal;">(해당 등급 전용 가격)</span>
          </div>
          <table class="options-table">
            <thead>
              <tr>
                <th style="width: 25%;">옵션명</th>
                <th style="width: 25%;">선택 가격</th>
                <th style="width: 50%;">상세 품목 구성</th>
              </tr>
            </thead>
            <tbody>
              ${optionsHtml}
            </tbody>
          </table>
        </div>

        <div class="card">
          <div class="section-title">
            <span>📋 기본 출고 사양</span>
          </div>
          <div>
            ${standardHtml}
          </div>
        </div>
      `;
    }

    function renderError(message, query) {
      const content = document.getElementById('contentView');
      content.innerHTML = `
        <div class="alert-box" style="border-color: #ef4444; background-color: #1f1315; color: #fca5a5;">
          <div class="alert-title" style="color: #ef4444;">🚨 네트워크 오류</div>
          <div>${escapeHtml(message)}</div>
        </div>
      `;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function applyParamsFromUrl() {
      const p = parseParams();
      let brand = p.brand;
      if (!brand && p.model) {
        brand = findBrandForModel(p.model);
      }
      if (!brand && catalogBrands.length > 0) {
        brand = catalogBrands[0];
      }

      populateBrands(brand);
      populateModels(brand, p.model);

      const currentModel = document.getElementById('selectModel').value || p.model;
      populateYears(brand, currentModel, p.year);

      const currentYear = document.getElementById('selectYear').value || p.year;
      populateGrades(brand, currentModel, currentYear, p.grade);

      // model, year가 있으면 바로 스펙 조회
      if (p.model && p.year) {
        const gradeToFetch = p.grade || document.getElementById('selectGrade').value;
        fetchCatalogSpec('danawa', p.model, p.year, gradeToFetch);
      } else {
        // 파라미터가 없으면 로딩창 닫고 안내 문구 노출
        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('contentView').style.display = 'block';
        document.getElementById('contentView').innerHTML = `
          <div class="alert-box" style="border-color: #10b981/40; background-color: #064e3b/20; color: #6ee7b7;">
            <div class="alert-title" style="color: #10b981;">💡 상단 드롭다운에서 차량을 선택하세요</div>
            <div>브랜드, 차종, 연식, 등급을 차례로 선택하신 후 [조회] 버튼을 누르면 출고가 및 선택 옵션 목록이 표시됩니다.</div>
          </div>
        `;
      }
    }

    async function init() {
      try {
        const res = await fetch('/api/catalog-v2/tree');
        const data = await res.json();
        if (data && data.success) {
          catalogTree = data.tree;
          catalogBrands = data.brands || [];
        }
      } catch (err) {
        console.error('카탈로그 트리 로드 실패:', err);
      }

      applyParamsFromUrl();
    }

    // 브랜드 변경 이벤트
    document.getElementById('selectBrand').addEventListener('change', (e) => {
      const brand = e.target.value;
      populateModels(brand, '');
      populateYears(brand, '', '');
      populateGrades(brand, '', '', '');
    });

    // 차종 변경 이벤트
    document.getElementById('selectModel').addEventListener('change', (e) => {
      const brand = document.getElementById('selectBrand').value;
      const model = e.target.value;
      populateYears(brand, model, '');
      populateGrades(brand, model, '', '');
    });

    // 연식 변경 이벤트
    document.getElementById('selectYear').addEventListener('change', (e) => {
      const brand = document.getElementById('selectBrand').value;
      const model = document.getElementById('selectModel').value;
      const year = e.target.value;
      populateGrades(brand, model, year, '');
    });

    // 조회 버튼 클릭 이벤트
    document.getElementById('btnSearch').addEventListener('click', () => {
      const brand = document.getElementById('selectBrand').value;
      const model = document.getElementById('selectModel').value;
      const year = document.getElementById('selectYear').value;
      const grade = document.getElementById('selectGrade').value;

      if (!model || !year) {
        alert('차종과 연식을 선택해주세요.');
        return;
      }

      const newHash = `brand=${encodeURIComponent(brand)}&model=${encodeURIComponent(model)}&year=${encodeURIComponent(year)}&grade=${encodeURIComponent(grade)}`;
      window.location.hash = newHash;

      fetchCatalogSpec('danawa', model, year, grade);
    });

    // 해시 변경 시 자동 반영
    window.addEventListener('hashchange', () => {
      applyParamsFromUrl();
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
