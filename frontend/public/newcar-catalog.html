<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신차 공식 카탈로그 뷰어 | J-PRO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b0c10;
      color: #e4e4e7;
      line-height: 1.5;
      font-size: 13px;
    }
    header {
      background-color: #14151b;
      border-bottom: 1px solid #262833;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.02em;
    }
    .header-badge {
      font-size: 11px;
      background-color: #1e293b;
      color: #94a3b8;
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid #334155;
    }
    .search-box {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background-color: #0b0c10;
      border: 1px solid #262833;
      border-radius: 8px;
      padding: 8px 12px 8px 36px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #71717a;
      pointer-events: none;
      font-size: 14px;
    }
    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #71717a;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }
    .clear-btn:hover {
      color: #ffffff;
    }
    main {
      display: flex;
      height: calc(100vh - 61px);
      overflow: hidden;
    }
    /* 사이드바: 모델 목록 */
    .sidebar-models {
      width: 320px;
      min-width: 260px;
      background-color: #111217;
      border-right: 1px solid #1e2029;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-header {
      padding: 10px 14px;
      border-bottom: 1px solid #1e2029;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #14151b;
      font-size: 11px;
      color: #8b8e9d;
      font-weight: 600;
    }
    .model-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .model-item {
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.12s ease, color 0.12s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      color: #d4d4d8;
    }
    .model-item:hover {
      background-color: #1a1c26;
      color: #ffffff;
    }
    .model-item.active {
      background-color: #0369a1;
      color: #ffffff;
      font-weight: 700;
    }
    .model-name {
      font-size: 12.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .model-meta {
      font-size: 10.5px;
      color: #71717a;
      margin-left: 8px;
      font-family: monospace;
      flex-shrink: 0;
    }
    .model-item.active .model-meta {
      color: #bae6fd;
    }
    /* 본문 영역 */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background-color: #0b0c10;
    }
    /* 상태 표시 */
    .status-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      color: #a1a1aa;
      gap: 12px;
      text-align: center;
    }
    .btn-retry {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-retry:hover {
      background-color: #0369a1;
    }
    /* 모델 & 연식 헤더 카드 */
    .model-header-card {
      background-color: #14151b;
      border: 1px solid #1e2029;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .model-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .current-model-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
    }
    .year-tabs-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .year-tab-label {
      font-size: 11px;
      color: #71717a;
      font-weight: 600;
      margin-right: 4px;
    }
    .year-chip {
      background-color: #1e2029;
      border: 1px solid #2e3240;
      color: #a1a1aa;
      padding: 4px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .year-chip:hover {
      background-color: #272a38;
      color: #ffffff;
    }
    .year-chip.active {
      background-color: #38bdf8;
      border-color: #38bdf8;
      color: #0f172a;
      font-weight: 800;
    }
    /* 등급 목록 */
    .grades-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 4px;
      border-top: 1px dashed #1e2029;
    }
    .grades-label {
      font-size: 11px;
      color: #71717a;
      font-weight: 600;
      margin-right: 4px;
    }
    .grade-badge {
      background-color: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    /* 옵션 테이블 */
    .table-container {
      background-color: #14151b;
      border: 1px solid #1e2029;
      border-radius: 12px;
      overflow: hidden;
    }
    .table-header-info {
      padding: 12px 18px;
      border-bottom: 1px solid #1e2029;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #161822;
      font-size: 12px;
      color: #8b8e9d;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background-color: #14151b;
      color: #8b8e9d;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 10px 14px;
      border-bottom: 1px solid #262833;
      white-space: nowrap;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #1e2029;
      font-size: 12.5px;
      vertical-align: top;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background-color: #161822;
    }
    .col-name {
      font-weight: 700;
      color: #ffffff;
      width: 220px;
      min-width: 180px;
    }
    .col-price {
      width: 120px;
      text-align: right;
      font-family: monospace;
      font-weight: 700;
      white-space: nowrap;
    }
    .col-desc {
      color: #d4d4d8;
      font-size: 12px;
      line-height: 1.6;
    }
    .col-source {
      width: 90px;
      text-align: center;
      white-space: nowrap;
    }
    .price-valid {
      color: #fcd34d;
      font-size: 13px;
    }
    .price-missing {
      color: #71717a;
      font-size: 11px;
      font-weight: normal;
    }
    .desc-missing {
      color: #52525b;
      font-style: italic;
    }
    .source-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
    }
    .source-danawa {
      background-color: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(14, 165, 233, 0.4);
      color: #7dd3fc;
    }
    .source-encar {
      background-color: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fda4af;
    }
    .source-other {
      background-color: #27272a;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
    }
    .empty-options-card {
      padding: 40px 20px;
      text-align: center;
      color: #71717a;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top: 3px solid #38bdf8;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 헤더 영역 -->
  <header>
    <div class="header-title-box">
      <span class="header-title">📖 신차 공식 카탈로그 뷰어</span>
      <span class="header-badge" id="totalModelsBadge">불러오는 중...</span>
    </div>

    <!-- 검색창 -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="모델명 검색 (예: 카니발, 쏘렌토, 그랜저, 아반떼...)" autocomplete="off">
      <button id="clearSearchBtn" class="clear-btn" style="display:none;" title="검색어 지우기">✕</button>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main>
    <!-- 좌측 모델 목록 -->
    <aside class="sidebar-models">
      <div class="sidebar-header">
        <span>차량 모델 목록</span>
        <span id="filteredCount">0개</span>
      </div>
      <div class="model-list-container" id="modelListContainer">
        <!-- JS로 동적 렌더링 -->
      </div>
    </aside>

    <!-- 우측 상세 콘텐츠 -->
    <section class="content-area" id="contentArea">
      <!-- 로딩 / 에러 / 상세 뷰가 동적으로 렌더링됨 -->
      <div class="status-panel" id="loadingState">
        <div class="spinner"></div>
        <div>신차 공식 카탈로그 데이터를 불러오는 중입니다...</div>
      </div>
      <div class="status-panel" id="errorState" style="display:none;">
        <div style="font-size: 16px; font-weight: 700; color: #f87171;">카탈로그를 불러오지 못했습니다</div>
        <div style="font-size: 12px; color: #a1a1aa;">서버 연결 상태를 확인 후 다시 시도해주세요.</div>
        <button class="btn-retry" id="retryBtn">다시 시도</button>
      </div>
      <div id="catalogDetailView" style="display:none;">
        <!-- 상단 모델 & 연식 정보 카드 -->
        <div class="model-header-card">
          <div class="model-title-row">
            <h1 class="current-model-title" id="currentModelTitle">-</h1>
            <div class="year-tabs-box">
              <span class="year-tab-label">연식 선택</span>
              <div id="yearChipsContainer" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
            </div>
          </div>

          <!-- 등급 목록 -->
          <div class="grades-box" id="gradesBox" style="display:none;">
            <span class="grades-label">포함 등급</span>
            <div id="gradesChips" style="display:flex; gap:6px; flex-wrap: wrap;"></div>
          </div>
        </div>

        <!-- 옵션 표 -->
        <div class="table-container">
          <div class="table-header-info">
            <span id="optionsCountLabel">옵션 목록</span>
            <span id="selectedYearMeta"></span>
          </div>
          <div id="tableWrapper">
            <table>
              <thead>
                <tr>
                  <th class="col-name">공식 옵션명</th>
                  <th class="col-price">가격 (만원)</th>
                  <th class="col-desc">옵션 상세 구성 및 설명</th>
                  <th class="col-source">출처</th>
                </tr>
              </thead>
              <tbody id="optionsTableBody">
                <!-- 동적 렌더링 -->
              </tbody>
            </table>
          </div>
          <div id="emptyOptionsBox" class="empty-options-card" style="display:none;">
            <div style="font-size: 20px;">📦</div>
            <div style="font-weight: 700; color: #a1a1aa;">옵션 없음</div>
            <div style="font-size: 11px;">해당 모델·연식에 등록된 공식 신차 추가 옵션 데이터가 없습니다.</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 카탈로그 전역 상태
    let globalCatalog = null;
    let allModelNames = [];
    let selectedModel = '';
    let selectedYear = '';

    // DOM 요소
    const totalModelsBadge = document.getElementById('totalModelsBadge');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const modelListContainer = document.getElementById('modelListContainer');
    const filteredCount = document.getElementById('filteredCount');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const retryBtn = document.getElementById('retryBtn');
    const catalogDetailView = document.getElementById('catalogDetailView');
    const currentModelTitle = document.getElementById('currentModelTitle');
    const yearChipsContainer = document.getElementById('yearChipsContainer');
    const gradesBox = document.getElementById('gradesBox');
    const gradesChips = document.getElementById('gradesChips');
    const tableWrapper = document.getElementById('tableWrapper');
    const optionsTableBody = document.getElementById('optionsTableBody');
    const emptyOptionsBox = document.getElementById('emptyOptionsBox');
    const optionsCountLabel = document.getElementById('optionsCountLabel');
    const selectedYearMeta = document.getElementById('selectedYearMeta');

    // 제조사 접두사 정규화
    function normalizeModelName(name) {
      if (!name) return '';
      return String(name)
        .replace(/^(현대|기아|제네시스|쉐보레|르노코리아|르노삼성|KG모빌리티|쌍용)\s*/i, '')
        .replace(/\s+/g, '')
        .toLowerCase();
    }

    // URL 해시 파싱 (#model=...&year=...)
    function parseHash() {
      const hashStr = window.location.hash ? window.location.hash.substring(1) : '';
      if (!hashStr) return { model: '', year: '' };
      
      const params = new URLSearchParams(hashStr);
      let model = params.get('model') || '';
      let year = params.get('year') || '';

      try {
        model = decodeURIComponent(model).trim();
      } catch (e) {}

      try {
        year = decodeURIComponent(year).trim();
      } catch (e) {}

      return { model, year };
    }

    // URL 해시 업데이트
    function updateHash(model, year) {
      if (!model) return;
      const params = new URLSearchParams();
      params.set('model', model);
      if (year) params.set('year', year);
      const newHash = '#' + params.toString();
      if (window.location.hash !== newHash) {
        history.replaceState(null, '', newHash);
      }
    }

    // 카탈로그 데이터 로드 (/api/newcar_catalog 인자 없이 fetch)
    async function fetchCatalog() {
      loadingState.style.display = 'flex';
      errorState.style.display = 'none';
      catalogDetailView.style.display = 'none';

      try {
        const res = await fetch('/api/newcar_catalog', {
          headers: { 'Accept': 'application/json' },
          cache: 'no-cache'
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();
        if (!data || !data.success || !data.catalog) {
          throw new Error('응답 형식 불일치');
        }

        globalCatalog = data.catalog;
        allModelNames = Object.keys(globalCatalog);

        totalModelsBadge.textContent = `총 ${allModelNames.length.toLocaleString()}개 모델`;
        loadingState.style.display = 'none';

        // 해시 파라미터 적용 또는 기본 모델 렌더링
        applyInitialSelection();

      } catch (err) {
        console.error('[NewCarCatalogViewer] fetch failed:', err);
        loadingState.style.display = 'none';
        errorState.style.display = 'flex';
        totalModelsBadge.textContent = '불러오기 실패';
      }
    }

    // 최초 로드 시 해시 확인 및 렌더링
    function applyInitialSelection() {
      const { model: hashModel, year: hashYear } = parseHash();

      if (hashModel) {
        searchInput.value = hashModel;
        clearSearchBtn.style.display = 'block';

        // 일치하는 카탈로그 모델 키 찾기
        const matched = findBestMatchingModel(hashModel);
        if (matched) {
          selectModel(matched, hashYear);
          renderModelList(hashModel);
          return;
        }
      }

      // 검색어 없는 경우 상위 모델들 렌더링 및 첫 번째 모델 선택
      renderModelList('');
      if (allModelNames.length > 0) {
        const first = allModelNames[0];
        selectModel(first, hashYear);
      }
    }

    // 스마트 모델 매칭
    function findBestMatchingModel(inputName) {
      if (!inputName || !allModelNames.length) return '';
      // 1. 정확 일치
      if (globalCatalog[inputName]) return inputName;

      // 2. 제조사/공백 제거 정규화 일치
      const normInput = normalizeModelName(inputName);
      for (const m of allModelNames) {
        if (normalizeModelName(m) === normInput) return m;
      }

      // 3. 괄호 제거 정규화 일치
      const noParenInput = normalizeModelName(inputName.replace(/\(.*?\)/g, ''));
      for (const m of allModelNames) {
        const mNorm = normalizeModelName(m.replace(/\(.*?\)/g, ''));
        if (mNorm === noParenInput) return m;
      }

      // 4. 부분 포함 일치 (길이 2 이상)
      if (normInput.length >= 2) {
        for (const m of allModelNames) {
          const mNorm = normalizeModelName(m);
          if (mNorm.includes(normInput) || normInput.includes(mNorm)) {
            return m;
          }
        }
      }

      return '';
    }

    // 좌측 모델 목록 렌더링 (성능 최적화: 검색어 일치 항목 또는 상위 N개만 렌더링)
    function renderModelList(keyword) {
      modelListContainer.innerHTML = '';
      const cleanKw = normalizeModelName(keyword);

      let matched = [];
      if (!cleanKw) {
        matched = allModelNames.slice(0, 100); // 전체일 땐 상위 100개
        filteredCount.textContent = `${allModelNames.length}개 중 100개 표시`;
      } else {
        matched = allModelNames.filter(m => {
          return normalizeModelName(m).includes(cleanKw) || m.toLowerCase().includes(keyword.toLowerCase());
        });
        filteredCount.textContent = `${matched.length}개 일치`;
      }

      if (matched.length === 0) {
        modelListContainer.innerHTML = '<div style="padding:20px; text-align:center; color:#71717a; font-size:12px;">일치하는 모델이 없습니다</div>';
        return;
      }

      const frag = document.createDocumentFragment();
      matched.forEach(m => {
        const div = document.createElement('div');
        div.className = 'model-item' + (m === selectedModel ? ' active' : '');
        div.onclick = () => selectModel(m);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'model-name';
        nameSpan.textContent = m;
        nameSpan.title = m;

        // 연식 개수 메타
        const yearsCount = Object.keys(globalCatalog[m] || {}).length;
        const metaSpan = document.createElement('span');
        metaSpan.className = 'model-meta';
        metaSpan.textContent = `${yearsCount}개 연식`;

        div.appendChild(nameSpan);
        div.appendChild(metaSpan);
        frag.appendChild(div);
      });

      modelListContainer.appendChild(frag);
    }

    // 모델 선택
    function selectModel(modelName, requestedYear) {
      if (!globalCatalog || !globalCatalog[modelName]) return;
      selectedModel = modelName;

      // 사이드바 active 갱신
      const items = modelListContainer.querySelectorAll('.model-item');
      items.forEach(el => {
        const name = el.querySelector('.model-name')?.textContent;
        if (name === modelName) el.classList.add('active');
        else el.classList.remove('active');
      });

      currentModelTitle.textContent = modelName;
      catalogDetailView.style.display = 'block';

      // 연식 목록 파싱
      const yearsMap = globalCatalog[modelName] || {};
      const allYears = Object.keys(yearsMap).sort((a, b) => {
        return Number(b) - Number(a); // 최신 연식 내림차순
      });

      yearChipsContainer.innerHTML = '';
      if (allYears.length === 0) {
        selectedYear = '';
        renderOptionsTable([]);
        return;
      }

      // 요청 연식이 있으면 매칭, 없으면 최신 연식 자동 선택
      let targetYear = allYears[0];
      if (requestedYear) {
        const reqStr = String(requestedYear).trim();
        // 4자리 매칭 또는 끝 2자리 매칭
        const found = allYears.find(y => y === reqStr || y.endsWith(reqStr));
        if (found) targetYear = found;
      }
      selectedYear = targetYear;

      // 연식 칩 렌더링
      allYears.forEach(yr => {
        const chip = document.createElement('button');
        chip.className = 'year-chip' + (yr === selectedYear ? ' active' : '');
        chip.textContent = `${yr}년`;
        chip.onclick = () => selectYear(yr);
        yearChipsContainer.appendChild(chip);
      });

      // 해당 연식 렌더링
      renderYearDetail(modelName, selectedYear);
      updateHash(selectedModel, selectedYear);
    }

    // 연식 선택
    function selectYear(yr) {
      selectedYear = yr;
      const chips = yearChipsContainer.querySelectorAll('.year-chip');
      chips.forEach(c => {
        if (c.textContent === `${yr}년`) c.classList.add('active');
        else c.classList.remove('active');
      });

      renderYearDetail(selectedModel, selectedYear);
      updateHash(selectedModel, selectedYear);
    }

    // 선택된 모델·연식 상세 렌더링
    function renderYearDetail(modelName, year) {
      const yearData = (globalCatalog[modelName] && globalCatalog[modelName][year]) || null;
      if (!yearData) {
        gradesBox.style.display = 'none';
        renderOptionsTable([]);
        return;
      }

      // 등급 목록 (grades)
      const grades = yearData.grades || [];
      if (grades && grades.length > 0) {
        gradesBox.style.display = 'flex';
        gradesChips.innerHTML = '';
        grades.forEach(g => {
          const badge = document.createElement('span');
          badge.className = 'grade-badge';
          badge.textContent = g;
          gradesChips.appendChild(badge);
        });
      } else {
        gradesBox.style.display = 'none';
      }

      // 옵션 목록 (options: { [optName]: { price, desc, source } })
      const optsObj = yearData.options || {};
      const optEntries = Object.entries(optsObj);

      renderOptionsTable(optEntries, year);
    }

    // 옵션 표 렌더링
    function renderOptionsTable(optEntries, year) {
      optionsTableBody.innerHTML = '';

      if (!optEntries || optEntries.length === 0) {
        tableWrapper.style.display = 'none';
        emptyOptionsBox.style.display = 'flex';
        optionsCountLabel.textContent = '옵션 없음 (0개)';
        selectedYearMeta.textContent = year ? `${year}년 데이터` : '';
        return;
      }

      tableWrapper.style.display = 'block';
      emptyOptionsBox.style.display = 'none';
      optionsCountLabel.textContent = `공식 추가 옵션 총 ${optEntries.length}개`;
      selectedYearMeta.textContent = year ? `${year}년 카탈로그` : '';

      const frag = document.createDocumentFragment();

      optEntries.forEach(([optName, optInfo]) => {
        const tr = document.createElement('tr');

        // 1) 공식 옵션명
        const tdName = document.createElement('td');
        tdName.className = 'col-name';
        tdName.textContent = optName;

        // 2) 가격 (만원)
        const tdPrice = document.createElement('td');
        tdPrice.className = 'col-price';
        const rawPrice = optInfo ? optInfo.price : null;
        if (typeof rawPrice === 'number' && rawPrice > 0) {
          const man = Math.round(rawPrice / 10000);
          tdPrice.innerHTML = `<span class="price-valid">${man.toLocaleString()}만</span>`;
        } else {
          tdPrice.innerHTML = `<span class="price-missing">가격 미확인</span>`;
        }

        // 3) 설명
        const tdDesc = document.createElement('td');
        tdDesc.className = 'col-desc';
        const rawDesc = optInfo ? optInfo.desc : '';
        if (rawDesc && String(rawDesc).trim()) {
          tdDesc.textContent = String(rawDesc).trim();
        } else {
          tdDesc.innerHTML = `<span class="desc-missing">설명 없음</span>`;
        }

        // 4) 출처
        const tdSource = document.createElement('td');
        tdSource.className = 'col-source';
        const src = optInfo ? (optInfo.source || '') : '';
        let srcLabel = '기타';
        let srcClass = 'source-other';
        if (src.toLowerCase() === 'danawa') {
          srcLabel = '신차가격표';
          srcClass = 'source-danawa';
        } else if (src.toLowerCase() === 'encar') {
          srcLabel = '엔카';
          srcClass = 'source-encar';
        } else if (src) {
          srcLabel = src;
        }
        tdSource.innerHTML = `<span class="source-badge ${srcClass}">${srcLabel}</span>`;

        tr.appendChild(tdName);
        tr.appendChild(tdPrice);
        tr.appendChild(tdDesc);
        tr.appendChild(tdSource);
        frag.appendChild(tr);
      });

      optionsTableBody.appendChild(frag);
    }

    // 이벤트 리스너 등록
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      clearSearchBtn.style.display = val ? 'block' : 'none';
      renderModelList(val);
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      renderModelList('');
      searchInput.focus();
    });

    retryBtn.addEventListener('click', () => {
      fetchCatalog();
    });

    // 주소 해시 변경 시 자동 반영
    window.addEventListener('hashchange', () => {
      if (!globalCatalog) return;
      const { model, year } = parseHash();
      if (model && model !== selectedModel) {
        const matched = findBestMatchingModel(model);
        if (matched) {
          selectModel(matched, year);
          return;
        }
      }
      if (year && year !== selectedYear && selectedModel) {
        selectYear(year);
      }
    });

    // 초기 실행
    fetchCatalog();
  </script>
</body>
</html>
