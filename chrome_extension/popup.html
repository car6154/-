<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: 'Segoe UI', Malgun Gothic, sans-serif;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 15px;
      color: #38bdf8;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 500;
      min-height: 18px;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h3>🏅 J-PRO 쿠키 동기화</h3>
  <p>헤이딜러 & 견적조회(차얼마2) 로그인 쿠키를 실시간으로 자동 동기화합니다.</p>
  
  <div style="display: flex; gap: 6px; margin-bottom: 10px;">
    <a href="https://dealer.heydealer.com" target="_blank" style="flex:1; font-size:11px; color:#38bdf8; text-decoration:none; background:#1e293b; padding:6px 0; border-radius:6px; border:1px solid #334155;">🔗 헤이딜러 열기</a>
    <a href="https://purchase.autoplus.co.kr/login/login.do" target="_blank" style="flex:1; font-size:11px; color:#34d399; text-decoration:none; background:#1e293b; padding:6px 0; border-radius:6px; border:1px solid #334155;">🔗 차얼마2 열기</a>
  </div>

  <button id="syncBtn">⚡ 헤이딜러 쿠키 전송</button>
  <button id="syncApBtn" style="margin-top: 8px; background: linear-gradient(135deg, #059669, #10b981);">🚗 견적조회(차얼마2) 쿠키 전송</button>
  
  <div style="display: flex; gap: 6px; margin-top: 8px;">
    <button id="copyBtn" style="flex: 1; background: #334155; font-size: 11px; padding: 7px 0;">📋 헤이 복사</button>
    <button id="copyApBtn" style="flex: 1; background: #065f46; font-size: 11px; padding: 7px 0;">📋 차얼마 복사</button>
  </div>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
